<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="../style/output.css">
</head>

<body>
    <div class="flex justify-between w-screen h-screen">
        <!-- form -->
        <div class="flex flex-col justify-center items-center w-full">
            <div class="shadow rounded-2xl bg-purple-200 p-8">
                <label for="nisn" class="block text-sm font-medium text-gray-700">Username</label>
                <input type="text" id="nisn" name="nisn"
                    class="mt-1 h-10 px-5 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm">
                <label for="password" class="block text-sm font-medium text-gray-700 mt-4">Password</label>
                <input type="password" id="password" name="password"
                    class="mt-1 h-10 px-5 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm">
                <button class="mt-4 w-full bg-indigo-500 text-white py-2 rounded-md hover:bg-indigo-600">Login</button>
            </div>
        </div>
        <div class="bg-cover w-full bg-purple-800 shadow rounded-l-2xl">
            <h1 class="m-15 text-5xl font-bold text-white">Login</h1>
        </div>

    </div>
</body>
<script type="module" src="../js/main.js"></script>
<script type="module">
    import axios from "axios";
    import { API_BASE_URL } from "../config/config.js";
    const nisn = document.getElementById("nisn");
    const password = document.getElementById("password");
    document.querySelector("button").addEventListener("click", () => {
        axios.post(`${API_BASE_URL}LOGIN.PHP`, {
            username: nisn.value,
            password: password.value
        }, {
            headers: {
                'ngrok-skip-browser-warning': 'true'
            }
        }).then(res => {
            if (res.data.status === "success") {
                console.log(res.data);
                localStorage.setItem("nisn", res.data.data.username);
                    localStorage.setItem("role", res.data.data.role);
                    window.location.href = "home.html";
                } else {
                    alert(res.data.message);
                }
            }).catch(err => {
                console.error(err);
            });
    })
</script>

</html>
